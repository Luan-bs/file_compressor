[project]
name = "file-compressor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luan Bitencourt Sarmento", email = "luanbitencourt57@gmail.com" }
]
requires-python = ">=3.14"
